[project]
name = "murmur"
dynamic = ["version"]
description = "Fast, accurate, private transcription. Whisper on your own GPU: about 100x realtime, and audio never leaves your machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10,<3.14"
keywords = ["transcription", "speech-to-text", "whisper", "faster-whisper", "asr", "cuda", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.2.1,<2",
    "av>=12,<16",                                                  # PyAV 16+ breaks faster-whisper 1.2 (metadata_errors)
    "nvidia-cublas-cu12==12.8.4.1; sys_platform != 'darwin'",      # last cuBLAS with Windows wheels
    "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
]

[project.scripts]
murmur = "murmur.cli:main"

[project.urls]
Homepage = "https://github.com/clarson2706/murmur"
Issues = "https://github.com/clarson2706/murmur/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/murmur/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
